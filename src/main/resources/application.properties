spring.application.name=productservice
server.port=8080

# In-memory H2 by default so the app runs out of the box.
# Use --spring.profiles.active=mysql for MySQL (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:productservice
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# User service used to validate login tokens for product write operations
userservice.base-url=${USERSERVICE_URL:http://localhost:8082}

# Elasticsearch product search (HLD 3.2). Search falls back to the database when it is disabled or unreachable.
search.elasticsearch.enabled=${SEARCH_ELASTICSEARCH_ENABLED:true}
search.max-results=50
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=5s
